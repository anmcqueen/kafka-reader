spring:
  application:
    name: kafka-reader
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: myuser
    password: mypassword
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.StringDeserializer
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: test-consumer-group-v1
      auto-offset-reset: earliest
    properties:
      spring.json.trusted.packages: ru.mcqueen.kafka.kafka_reader.model
      spring.json.value.default.type: ru.mcqueen.kafka.kafka_reader.model.Weather
      spring.json.use.type.headers: false
app:
  kafka:
    topic:
      name: weather-data-topic